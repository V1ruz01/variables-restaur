{% extends "base.html" %}

{% block content %}
    
    <h2>
        Variables Restaurant
    </h2>
    <nav class='navbar navbar-expand-lg'>
        <div class='container-fluid'>
            {% if user.is_authenticated %}
                <div>
                    <a href='/logout'>
                        <button>
                            Logout
                        </button>
                    </a>
                </div>
            {% else %}
                <div style='display: flex; gap: 10px; padding: 3px;'>
                    <a href='/register'>
                        <button>
                            Register
                        </button>
                    </a>

                    <a href='login/'>
                        <button>
                            Login
                        </button>
                    </a>
                </div>
            {% endif %}
        </div>
    </nav>
{% endblock content %}
