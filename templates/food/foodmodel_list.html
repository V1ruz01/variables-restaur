{% extends "base.html" %}

{% block content %}    
    <nav class='navbar navbar-expand-lg'>
        <div class='container-fluid'>

            {% if user.is_authenticated %}

                <div class='collapse navbar-collapse' id='navbarSupportedContent'>
                    <ul class='navbar-nav me-auto mb-2 mb-lg-0'>
                        <a class='nav-link dropdown-toggle' role='button' data-bs-toggle='dropdown' area-expanded='false'>
                            Cart Menu
                        </a>

                        <!-- Выпадайка в меню корзины -->
                        <ul class='dropdown-menu'>
                            <li><a class='nav-link' href='cart/1'>View Cart</a></li>
                            <li><a class='nav-link' href='cart/create'>Create a Cart</a></li>
                        </ul>

                        <!-- Осторожно! Инвалид!! -->
                        <li><form method="post" action="{% url 'account:logout' %}">
                            {% csrf_token %}
                            <button type="submit" class='nav-link'>Logout</button>
                        </form></li>
                    </ul>
                </div>

            {% else %}
            
                <div class='collapse navbar-collapse' id='navbarSupportedContent'>
                    <ul class='navbar-nav me-auto mb-2 mb-lg-0'>
                        <li><a class='nav-link' href='/register'>Register</a></li>
                        <li><a class='nav-link' href='login/'>Login</a></li>
                    </ul>
                </div>

            {% endif %}
        </div>
    </nav>
{% endblock content %}
